name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.build.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GHCR_PAT }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        id: build
        run: |
          TAG=$(date -u +%Y%m%d%H%M)-${GITHUB_SHA:0:6}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          docker build -t ghcr.io/netkey/asura:$TAG .
          echo "Built tag: $TAG"

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/netkey/asura:${{ steps.build.outputs.TAG }}

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      GRACE: 120
    steps:
      - uses: actions/checkout@v4

      # 从运行中容器的 environment 读取实际的 http_key
      # 容器有 NAKAMA_SERVER_KEY 环境变量（536a2bc 起已暴露）
      # 若容器未运行则跳过排空（部署完成后直接启动新容器）
      - name: Check Nakama & read server key
        id: nkkey
        run: |
          CID=$(docker ps -q -f name=nakama 2>/dev/null || true)
          if [ -z "$CID" ]; then
            echo "RUNNING=false" >> $GITHUB_OUTPUT
            echo "Nakama 未运行，跳过排空步骤"
            exit 0
          fi
          # 从运行中容器读取实际 key
          KEY=$(docker exec nakama printenv NAKAMA_SERVER_KEY 2>/dev/null || true)
          # 兜底：从仓库版本 docker-compose.yml 解析默认值
          if [ -z "$KEY" ] && [ -f "${GITHUB_WORKSPACE}/docker-compose.yml" ]; then
            KEY=$(grep -oP 'NAKAMA_SERVER_KEY:\s+\$\{.*:-\K[^}]+' "${GITHUB_WORKSPACE}/docker-compose.yml" 2>/dev/null || true)
          fi
          echo "KEY=${KEY:-defaultkey}" >> $GITHUB_OUTPUT
          echo "RUNNING=true" >> $GITHUB_OUTPUT
          echo "读取到 NAKAMA_SERVER_KEY"

      - name: Drain — 阻止新对局并通知现有对局排空
        if: steps.nkkey.outputs.RUNNING == 'true'
        env:
          KEY: ${{ steps.nkkey.outputs.KEY }}
        continue-on-error: true
        run: |
          echo "--- 排空开始（最长 ${GRACE}s）---"
          for i in 1 2 3; do
            if curl -sf -X POST "http://localhost:7350/v2/rpc/admin_drain?http_key=${KEY}" \
              -H 'Content-Type: application/json' \
              -d "{\"grace\":$GRACE}"; then
              echo "排空信号已发送"
              break
            fi
            echo "重试 $i/3..."
            sleep 3
          done

      - name: Wait — 轮询等待对局结束
        if: steps.nkkey.outputs.RUNNING == 'true'
        env:
          KEY: ${{ steps.nkkey.outputs.KEY }}
        run: |
          END=$((SECONDS + GRACE))
          while [ $SECONDS -lt $END ]; do
            body=$(curl -sf -X POST \
              "http://localhost:7350/v2/rpc/admin_get_match_count?http_key=${KEY}" \
              -H 'Content-Type: application/json' -d '{}' 2>/dev/null || echo '{"count":1}')
            count=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',1))")
            if [ "$count" -eq 0 ]; then
              echo "所有对局已结束（耗时 ${SECONDS}s）"
              break
            fi
            echo "等待 ${count} 个对局结束...（已等 ${SECONDS}s）"
            sleep 5
          done
          echo "排空阶段完成（共等待 ${SECONDS}s）"

      - name: Roll — 更新 docker-compose.yml 并重启
        env:
          TAG: ${{ needs.build.outputs.TAG }}
          KEY: ${{ steps.nkkey.outputs.KEY }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # 写入具体 tag 到 VPS 的 docker-compose.yml
          sed -i "s|image: ghcr.io/netkey/asura:.*|image: ghcr.io/netkey/asura:${TAG}|" \
            /data/nakama/docker-compose.yml
          docker compose -f /data/nakama/docker-compose.yml pull nakama
          # 保持 server key 与旧容器一致（未运行时不传，走 docker-compose 默认值）
          if [ -n "${KEY}" ]; then
            NAKAMA_SERVER_KEY="$KEY" docker compose -f /data/nakama/docker-compose.yml up -d
          else
            docker compose -f /data/nakama/docker-compose.yml up -d
          fi

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7350/ > /dev/null 2>&1; then
              echo "Nakama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1

      - name: Undrain — 恢复匹配
        if: steps.nkkey.outputs.RUNNING == 'true'
        env:
          KEY: ${{ steps.nkkey.outputs.KEY }}
        run: |
          for i in 1 2 3; do
            if curl -sf -X POST "http://localhost:7350/v2/rpc/admin_undrain?http_key=${KEY}" \
              -H 'Content-Type: application/json' -d '{}'; then
              echo "匹配已恢复"
              break
            fi
            sleep 3
          done
