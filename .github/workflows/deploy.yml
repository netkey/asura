name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.build.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GHCR_PAT }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        id: build
        run: |
          TAG=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:6}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          docker build -t ghcr.io/netkey/asura:$TAG .
          echo "Built tag: $TAG"

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/netkey/asura:${{ steps.build.outputs.TAG }}

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      NAKAMA_SRV_KEY: ${{ secrets.NAKAMA_SERVER_KEY || 'defaultkey' }}
      GRACE: 120
    steps:
      - uses: actions/checkout@v4

      - name: Drain — 阻止新对局并通知现有对局排空
        continue-on-error: true
        run: |
          echo "--- 排空开始（最长 ${GRACE}s）---"
          curl -s -X POST "http://localhost:7350/v2/rpc/admin_drain?http_key=${NAKAMA_SRV_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"grace\":$GRACE}"

      - name: Wait — 轮询等待对局结束
        env:
          DRAIN_START: ${{ github.run_id }}  # 仅用作唯一标记
        run: |
          END=$((SECONDS + GRACE))
          while [ $SECONDS -lt $END ]; do
            count=$(curl -s -X POST \
              "http://localhost:7350/v2/rpc/admin_get_match_count?http_key=${NAKAMA_SRV_KEY}" \
              -H 'Content-Type: application/json' -d '{}' | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('count',1))" 2>/dev/null || echo 1)
            if [ "$count" -eq 0 ]; then
              echo "所有对局已结束（耗时 ${SECONDS}s）"
              break
            fi
            echo "等待 ${count} 个对局结束...（已等 ${SECONDS}s）"
            sleep 5
          done
          echo "排空阶段完成（共等待 ${SECONDS}s）"

      - name: Roll — 更新 docker-compose.yml 并重启
        env:
          TAG: ${{ needs.build.outputs.TAG }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # 写入具体 tag 到 VPS 的 docker-compose.yml
          sed -i "s|image: ghcr.io/netkey/asura:.*|image: ghcr.io/netkey/asura:${TAG}|" \
            /data/nakama/docker-compose.yml
          docker compose -f /data/nakama/docker-compose.yml pull nakama
          docker compose -f /data/nakama/docker-compose.yml up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7350/ > /dev/null 2>&1; then
              echo "Nakama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1

      - name: Undrain — 恢复匹配
        run: |
          curl -s -X POST "http://localhost:7350/v2/rpc/admin_undrain?http_key=${NAKAMA_SRV_KEY}" \
            -H 'Content-Type: application/json' -d '{}'
          echo "匹配已恢复"
