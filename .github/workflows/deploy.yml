name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.build.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GHCR_PAT }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        id: build
        run: |
          TAG=$(date -u +%Y%m%d%H%M)-${GITHUB_SHA:0:6}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          docker build -t ghcr.io/netkey/asura:$TAG .
          echo "Built tag: $TAG"

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/netkey/asura:${{ steps.build.outputs.TAG }}

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      GRACE: 120
    steps:
      - uses: actions/checkout@v4

      # 从运行中容器的 environment 读取实际的 http_key
      # 容器有 NAKAMA_SERVER_KEY 环境变量（536a2bc 起已暴露）
      # 若容器未运行则跳过排空（部署完成后直接启动新容器）
      - name: Check Nakama & read server key
        id: nkkey
        run: |
          CID=$(docker ps -q -f name=nakama 2>/dev/null || true)
          if [ -z "$CID" ]; then
            echo "RUNNING=false" >> $GITHUB_OUTPUT
            echo "Nakama 未运行，跳过排空步骤"
            exit 0
          fi
          # 读取实际 NAKAMA_SERVER_KEY，优先级：
          # 1. VPS /data/nakama/.env（docker-compose 变量覆盖源）
          # 2. 运行中容器环境变量（536a2bc 起已暴露）
          # 3. docker-compose.yml 默认值
          KEY=""
          if [ -f "/data/nakama/.env" ]; then
            KEY=$(grep -oP '^NAKAMA_SERVER_KEY=\K.+' /data/nakama/.env 2>/dev/null || true)
          fi
          if [ -z "$KEY" ]; then
            KEY=$(docker exec nakama printenv NAKAMA_SERVER_KEY 2>/dev/null || true)
          fi
          if [ -z "$KEY" ] && [ -f "${GITHUB_WORKSPACE}/docker-compose.yml" ]; then
            KEY=$(grep -oP 'NAKAMA_SERVER_KEY:\s+\$\{.*:-\K[^}]+' "${GITHUB_WORKSPACE}/docker-compose.yml" 2>/dev/null || true)
          fi
          echo "KEY=${KEY:-defaultkey}" >> $GITHUB_OUTPUT
          echo "RUNNING=true" >> $GITHUB_OUTPUT
          echo "读取到 NAKAMA_SERVER_KEY"

      - name: Drain — 阻止新对局并通知现有对局排空
        if: steps.nkkey.outputs.RUNNING == 'true'
        env:
          KEY: ${{ steps.nkkey.outputs.KEY }}
        continue-on-error: true
        run: |
          echo "--- 排空开始（最长 ${GRACE}s）---"
          for i in 1 2 3; do
            if curl -sf -X POST "http://localhost:7350/v2/rpc/admin_drain?http_key=${KEY}" \
              -H 'Content-Type: application/json' \
              -d "\"$GRACE\""; then
              echo "排空信号已发送"
              break
            fi
            echo "重试 $i/3..."
            sleep 3
          done

      - name: Wait — 轮询等待对局结束
        if: steps.nkkey.outputs.RUNNING == 'true'
        env:
          KEY: ${{ steps.nkkey.outputs.KEY }}
        run: |
          END=$((SECONDS + GRACE))
          while [ $SECONDS -lt $END ]; do
            body=$(curl -sf -X POST \
              "http://localhost:7350/v2/rpc/admin_get_match_count?http_key=${KEY}" \
              -H 'Content-Type: application/json' -d '""' 2>/dev/null || echo '{"count":1}')
            count=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',1))")
            if [ "$count" -eq 0 ]; then
              echo "所有对局已结束（耗时 ${SECONDS}s）"
              break
            fi
            echo "等待 ${count} 个对局结束...（已等 ${SECONDS}s）"
            sleep 5
          done
          echo "排空阶段完成（共等待 ${SECONDS}s）"

      - name: Roll — 更新 docker-compose.yml 并重启
        env:
          TAG: ${{ needs.build.outputs.TAG }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # 写入完整的 docker-compose.yml（仓库版本=最新，含 NAKAMA_SERVER_KEY env、无 volume）
          cp "${GITHUB_WORKSPACE}/docker-compose.yml" /data/nakama/docker-compose.yml
          # 替换 image tag 为本次构建的具体版本
          sed -i "s|image: ghcr.io/netkey/asura:latest|image: ghcr.io/netkey/asura:${TAG}|" \
            /data/nakama/docker-compose.yml
          docker compose -f /data/nakama/docker-compose.yml pull nakama
          docker compose -f /data/nakama/docker-compose.yml up -d --force-recreate nakama

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7350/ > /dev/null 2>&1; then
              echo "Nakama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1

      - name: Undrain — 恢复匹配
        env:
          KEY: ${{ steps.nkkey.outputs.KEY }}
        run: |
          # 尝试多个 key 源（主 key 可能被 .env 覆盖）
          for key in "$KEY" "$(grep -oP '^NAKAMA_SERVER_KEY=\K.+' /data/nakama/.env 2>/dev/null)" "defaultkey"; do
            [ -z "$key" ] && continue
            if curl -sf -X POST "http://localhost:7350/v2/rpc/admin_undrain?http_key=$key" \
              -H 'Content-Type: application/json' -d '""'; then
              echo "匹配已恢复"
              exit 0
            fi
          done
          # 所有 key 都失败：直连 Postgres 清理 drain flag（最可靠兜底）
          echo "警告：所有 http_key 认证失败，直连 Postgres 清理..."
          docker exec postgres psql -U postgres -d nakama -c \
            "DELETE FROM storage WHERE collection='ops' AND key='drain';" \
            2>/dev/null && echo "drain flag 已清理" \
            || echo "警告：无法清 drain flag，匹配可能被阻断"

      - name: Notify Hermes to retest
        run: |
          if ! curl -sf http://localhost:9123/health > /dev/null 2>&1; then
            nohup python3 /root/.hermes/scripts/retest_server.py \
              > /tmp/retest_server.log 2>&1 &
            sleep 2
          fi
          curl -sf -X POST http://localhost:9123/retest
