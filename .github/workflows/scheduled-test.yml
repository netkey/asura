name: Scheduled Test

on:
  schedule:
    # 每天 UTC 2:00 / 14:00（北京时间 10:00 / 22:00）
    - cron: "0 2,14 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      # 模拟是确定性的：固定 seed 重跑没有新信息，按时间换 seed 探索新局面。失败时用打印的 seed 本地复现
      - name: Run 1000-game simulation with fresh seed
        run: |
          SEED=$(date -u +%Y%m%d%H)
          echo "seed=$SEED  (repro: lua5.4 demo_concurrent.lua --games 1000 --seed $SEED)"
          lua5.4 demo_concurrent.lua --games 1000 --seed "$SEED"
        timeout-minutes: 5
