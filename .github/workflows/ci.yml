name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua & luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Lua syntax check (luac -p)
        run: |
          # -exec {} \; 不传递子进程退出码，语法错误也会绿；xargs 任一失败即非零
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Luacheck lint
        run: luacheck --no-color .

      - name: Regression tests
        run: |
          for t in tests/*_test.lua; do lua5.4 "$t" || exit 1; done

      # 门禁：崩溃 / AI 遇到未知 pending / 服务端忽略响应 / 未结束率 >5% 即失败；两次运行 digest 不同 = 引入了不确定性
      - name: Simulation gate (200 games, deterministic)
        run: |
          lua5.4 demo_concurrent.lua | tee sim1.txt
          lua5.4 demo_concurrent.lua > sim2.txt
          d1=$(grep '^digest=' sim1.txt); d2=$(grep '^digest=' sim2.txt)
          [ "$d1" = "$d2" ] || { echo "FAIL nondeterministic: $d1 vs $d2"; exit 1; }
