name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua & luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Lua syntax check (luac -p)
        run: |
          # -exec {} \; 不传递子进程退出码，语法错误也会绿；xargs 任一失败即非零
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Luacheck lint
        run: luacheck --no-color .

      - name: Regression tests
        run: |
          for t in tests/*_test.lua; do lua5.4 "$t" || exit 1; done
