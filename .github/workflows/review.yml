name: Deep Review & Fix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # auto-fix 提交回 PR
      pull-requests: write  # PR 评论发表
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Lua 5.4 + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Lua syntax check (luac -p)
        run: find . -name '*.lua' -not -path './.git/*' -exec luac5.4 -p {} \;

      - name: Luacheck lint
        run: luacheck --no-color . || echo "lint_warnings=1" >> $GITHUB_OUTPUT
        id: luacheck

      - name: Pattern & security audit
        id: audit
        continue-on-error: true
        run: |
          echo "AUDIT_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          lua5.4 .github/scripts/audit.lua 2>&1 | tee -a $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Auto-fix mechanical issues (player_id guard)
        if: github.event_name == 'pull_request'
        run: lua5.4 .github/scripts/audit.lua --fix

      - name: Commit auto-fixes back to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain heroes/)" ]; then
            git config user.name "asura-bot[bot]"
            git config user.email "116823971+asura-bot[bot]@users.noreply.github.com"
            git add heroes/*.lua
            git commit -m "auto-fix: player_id guard 等审计修复"
            git push
          fi

      - name: Post audit report as PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const header = `## 🔍 代码审计结果\n\n`;
            const lintNote = process.env.LINT_WARNINGS
              ? '\n⚠️ Luacheck 有警告，请展开日志查看\n'
              : '\n✅ Luacheck 通过\n';

            // Read audit output from step output file
            let report = '';
            try {
              report = fs.readFileSync(process.env.GITHUB_OUTPUT, 'utf8');
              const m = report.match(/AUDIT_OUTPUT<<EOF([\s\S]*?)EOF/);
              if (m) report = m[1].trim();
            } catch (e) {
              report = '审计完成（无法读取详细报告，请查看 Actions 日志）';
            }

            const body = header
              + '```\n' + (report || '无输出') + '\n```\n'
              + lintNote
              + '\n---\n_🤖 Asura Audit Bot_';

            // Remove previous bot comments to avoid clutter
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const c of comments) {
              if (c.user.login.includes('asura-bot') || c.body.includes('Asura Audit Bot')) {
                await github.rest.issues.deleteComment({
                  comment_id: c.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              }
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Fail job if P1 issues found
        if: failure() && steps.audit.outcome == 'failure'
        run: exit 1
